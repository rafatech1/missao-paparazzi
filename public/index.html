<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Missão Paparazzi — Iana & Wllysses</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@400;500;600;700&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f8f5ee;
    --cream-deep:#efe8d8;
    --navy:#1e3a78;
    --navy-deep:#152a58;
    --ink:#33415f;
    --muted:#727ea0;
    --gold:#b8901f;
    --gold-soft:#e3c77e;
    --gold-text:#8a6a1a;
    --periwinkle:#8fa8d6;
    --dusty:#9bb6d1;
    --rose:#a8555c;
    --leaf:#4c7a5d;
    --card:#fffdf8;
    --line:rgba(30,58,120,.14);
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--cream);
    background-image:
      radial-gradient(ellipse 800px 460px at 90% 0%, rgba(155,182,209,.28), transparent 55%),
      radial-gradient(ellipse 700px 460px at 4% 8%, rgba(143,168,214,.22), transparent 55%),
      url("assets/paper_texture.webp");
    background-size:cover, cover, 1300px;
    background-attachment:fixed, fixed, fixed;
    color:var(--ink);
    font-family:'Poppins', system-ui, -apple-system, sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  img{max-width:100%;display:block;}
  h1,h2,h3{font-family:'Cormorant Garamond', Georgia, serif;font-weight:700;text-wrap:balance;margin:0;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:920px;margin:0 auto;padding:0 20px;}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;overflow:hidden;padding:56px 0 44px;text-align:center;
    border-bottom:1px solid var(--line);
  }
  .hero-frame{
    position:absolute;inset:14px;border:1px solid rgba(184,144,31,.4);border-radius:3px;pointer-events:none;
  }
  .hero-corner{position:absolute;width:44vw;max-width:230px;height:44vw;max-height:230px;pointer-events:none;z-index:0;opacity:.85;}
  .hero-corner img{position:absolute;filter:drop-shadow(0 4px 8px rgba(30,58,120,.12));}
  .hero-corner.tl{top:-12vw;left:-15vw;}
  .hero-corner.tr{top:-12vw;right:-15vw;transform:scaleX(-1);}
  .hero .eyebrow{
    position:relative;z-index:1;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--gold-text);margin-bottom:22px;display:block;font-weight:700;
  }
  .hero .names-img{
    position:relative;z-index:1;width:min(420px,72vw);margin:0 auto;
    filter:saturate(1.2) contrast(1.1) drop-shadow(0 2px 3px rgba(120,90,20,.22));
  }
  .hero .date{
    position:relative;z-index:1;margin-top:18px;font-size:1rem;color:var(--navy-deep);
    letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  }
  .hero p.lede{
    position:relative;z-index:1;max-width:520px;margin:24px auto 0;color:var(--ink);font-size:1rem;
  }
  .hero p.lede b{color:var(--navy);font-weight:600;}

  /* ---------- Section headings ---------- */
  .section{padding:48px 0;}
  .section-head{max-width:560px;margin:0 auto 30px;text-align:center;}
  .section-head h2{font-style:italic;font-size:clamp(1.6rem,4vw,2.1rem);color:var(--navy);}
  .section-head p{color:var(--muted);margin-top:10px;font-size:.96rem;}

  /* ---------- Challenge tickets ---------- */
  .cat-tabs{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px;
  }
  .cat-tab{
    border:1px solid rgba(30,58,120,.28);background:rgba(255,255,255,.6);color:var(--navy);
    padding:7px 14px;border-radius:20px;font-size:.82rem;font-weight:600;
  }
  .cat-tab.is-active{background:var(--navy);border-color:var(--navy);color:var(--cream);}
  .challenge-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;
  }
  .ticket .cat-label{
    font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;
    color:var(--gold-text);margin-top:-6px;
  }
  .ticket[hidden]{display:none;}
  .ticket{
    position:relative;background:var(--card);color:var(--ink);border-radius:10px;
    padding:20px 20px 18px;box-shadow:0 8px 20px rgba(30,58,120,.10);border:1px solid rgba(184,144,31,.22);
    display:flex;flex-direction:column;gap:10px;min-height:168px;
    transform:rotate(var(--r,0deg));
  }
  .challenge-grid .ticket:nth-child(3n+1){--r:-0.5deg;}
  .challenge-grid .ticket:nth-child(3n+2){--r:0.4deg;}
  .challenge-grid .ticket:nth-child(3n){--r:-0.25deg;}
  .ticket::before{
    content:"";position:absolute;left:14px;right:14px;bottom:8px;height:0;
    border-bottom:1.5px dashed rgba(30,58,120,.18);
  }
  .ticket .num{
    font-family:'Alex Brush', cursive;font-weight:400;font-size:2.1rem;color:var(--gold);line-height:1;
  }
  .ticket .txt{font-size:1.02rem;font-weight:500;flex:1;}
  .ticket .meta-row{
    display:flex;align-items:center;justify-content:space-between;margin-top:4px;
    font-size:.78rem;color:var(--muted);
  }
  .ticket .count{font-weight:600;}
  .ticket button.go{
    margin-top:2px;border:none;background:var(--navy);color:var(--cream);
    padding:10px 14px;border-radius:7px;font-weight:600;font-size:.88rem;
    letter-spacing:.01em;
  }
  .ticket button.go:active{transform:scale(.98);}

  /* ---------- Gallery ---------- */
  .gallery-empty{
    text-align:center;color:var(--muted);padding:30px 20px;border:1px dashed var(--line);
    border-radius:12px;font-size:.95rem;background:rgba(255,255,255,.4);
  }
  .gallery{
    columns:2;column-gap:16px;
  }
  @media(min-width:640px){.gallery{columns:3;}}
  .photo-card{
    break-inside:avoid;margin-bottom:16px;background:var(--card);border-radius:6px;
    padding:8px 8px 12px;box-shadow:0 6px 16px rgba(30,58,120,.12);border:1px solid rgba(184,144,31,.2);
    transform:rotate(var(--r,0deg));
  }
  .gallery .photo-card:nth-child(4n+1){--r:-1deg;}
  .gallery .photo-card:nth-child(4n+2){--r:0.8deg;}
  .gallery .photo-card:nth-child(4n+3){--r:-0.35deg;}
  .gallery .photo-card:nth-child(4n){--r:1.1deg;}
  .photo-card img{border-radius:2px;width:100%;object-fit:cover;background:#e7e2d422;aspect-ratio:4/5;}
  .photo-card video{border-radius:2px;width:100%;object-fit:cover;background:#000;aspect-ratio:4/5;}
  .photo-card .cap{
    color:var(--ink);margin-top:8px;font-size:.78rem;display:flex;justify-content:space-between;
    gap:8px;align-items:baseline;
  }
  .photo-card .cap .who{font-weight:600;}
  .photo-card .cap .tag{font-family:'Alex Brush', cursive;font-weight:400;color:var(--gold-text);font-size:1.15rem;white-space:nowrap;}

  /* ---------- Footer ---------- */
  footer{
    padding:36px 0 60px;text-align:center;color:var(--muted);font-size:.85rem;
    background:var(--cream-deep);
  }
  footer .stats{color:var(--navy);font-weight:600;margin-bottom:4px;font-size:.95rem;}
  footer .leaderboard{font-size:.8rem;color:var(--muted);margin-bottom:16px;}
  .btn-ghost{
    border:1px solid rgba(30,58,120,.3);background:rgba(255,255,255,.5);color:var(--navy);
    padding:10px 18px;border-radius:8px;font-size:.85rem;font-weight:500;text-decoration:none;display:inline-block;
  }
  .status-line{margin-top:14px;font-size:.8rem;min-height:1.2em;}
  .status-line.err{color:var(--rose);}
  .status-line.ok{color:var(--leaf);}
  .thanks{
    margin-top:30px;padding-top:24px;border-top:1px solid var(--line);
    font-family:'Cormorant Garamond', Georgia, serif;font-style:italic;font-size:1.15rem;
    color:var(--navy);max-width:440px;margin-left:auto;margin-right:auto;
  }
  .credit{margin-top:16px;font-size:.72rem;color:var(--muted);}
  .credit a{color:var(--muted);text-decoration:underline;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(21,42,88,.55);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  @media(min-width:640px){.modal-overlay{align-items:center;}}
  .modal-overlay[hidden]{display:none;}
  .modal{
    background:var(--card);color:var(--ink);width:100%;max-width:440px;
    border-radius:18px 18px 0 0;padding:24px 22px 28px;max-height:88vh;overflow:auto;
    border-top:1px solid rgba(184,144,31,.3);
  }
  @media(min-width:640px){.modal{border-radius:18px;border-top:none;border:1px solid rgba(184,144,31,.3);}}
  .modal .num{font-family:'Alex Brush', cursive;font-size:2rem;color:var(--gold);font-weight:400;}
  .modal h3{font-size:1.25rem;margin:4px 0 16px;font-style:italic;color:var(--navy);}
  .modal label{display:block;font-size:.8rem;font-weight:600;margin:14px 0 6px;color:var(--navy-deep);}
  .modal input[type="text"]{
    width:100%;padding:11px 12px;border-radius:8px;border:1px solid rgba(30,58,120,.2);
    font-family:inherit;font-size:.95rem;background:#fff;
  }
  .file-pick{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    border:2px dashed rgba(30,58,120,.25);border-radius:12px;padding:24px 12px;text-align:center;
    color:var(--navy-deep);font-size:.88rem;
  }
  .preview-wrap{position:relative;}
  .preview-wrap img{border-radius:10px;width:100%;max-height:320px;object-fit:cover;}
  .preview-wrap video{border-radius:10px;width:100%;max-height:320px;object-fit:cover;background:#000;}
  .preview-wrap button.retake{
    position:absolute;top:8px;right:8px;background:rgba(21,42,88,.7);color:#fff;
    border:none;border-radius:20px;padding:6px 12px;font-size:.75rem;
  }
  .modal .actions{display:flex;gap:10px;margin-top:20px;}
  .btn-primary{
    flex:1;background:var(--navy);color:var(--cream);border:none;border-radius:9px;
    padding:13px;font-weight:700;font-size:.95rem;
  }
  .btn-primary:disabled{opacity:.5;}
  .btn-secondary{
    background:transparent;border:1px solid rgba(30,58,120,.25);color:var(--navy);
    border-radius:9px;padding:13px 16px;font-weight:600;font-size:.9rem;
  }
  .modal-close{
    position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);
    font-size:1.3rem;line-height:1;padding:4px;
  }
  .modal-inner{position:relative;}
  .share-fallback{margin-top:10px;}
  .seal-divider{display:flex;align-items:center;gap:16px;justify-content:center;color:var(--gold);margin:8px 0 8px;}
  .seal-divider .line{flex:1;max-width:140px;height:1px;background:linear-gradient(90deg, transparent, currentColor);}
  .seal-divider .line.right{background:linear-gradient(90deg, currentColor, transparent);}
  .seal-divider .amp{font-family:'Cormorant Garamond', Georgia, serif;font-style:italic;font-weight:600;font-size:1.6rem;flex:none;color:var(--gold);}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* ---------- Identificação do convidado ---------- */
  .guest-chip{
    display:inline-flex;align-items:center;gap:6px;margin:0 0 26px;padding:8px 16px;
    background:rgba(255,255,255,.55);border:1px solid rgba(184,144,31,.3);border-radius:999px;
    font-size:.85rem;color:var(--navy-deep);
  }
  .guest-chip b{color:var(--navy);}
  .link-btn{
    background:none;border:none;padding:0;color:var(--gold-text);font-weight:600;font-size:inherit;
    text-decoration:underline;cursor:pointer;font-family:inherit;
  }
  .guest-line{font-size:.85rem;color:var(--navy-deep);margin-top:2px;}
  .guest-line b{color:var(--navy);}
  #intro-overlay .modal{max-width:400px;}
  .intro-eyebrow{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-text);font-weight:700;display:block;margin-bottom:6px;}
  .intro-note{font-size:.78rem;color:var(--muted);margin-top:10px;}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
  // Carrega só a função de "upload direto pro Blob" que o vídeo precisa —
  // isso deixa o navegador mandar o arquivo direto pro Vercel Blob Storage,
  // sem passar pelo limite de tamanho das funções serverless.
  try {
    var mod = await import('https://esm.sh/@vercel/blob@2.8.0/client');
    window.__blobUpload = mod.upload;
  } catch (e) {
    window.__blobUploadError = true;
  }
</script>
<script>
(function(){
  "use strict";

  var CATEGORIES = ["Essenciais", "Divertidos", "Momentos lindos", "Ousados"];

  var CHALLENGES = [
    {cat:0, text:"As alianças brilhando na luz"},
    {cat:0, text:"O primeiro brinde dos noivos"},
    {cat:0, text:"A primeira dança do casal"},
    {cat:0, text:"O corte do bolo"},
    {cat:0, text:"O buquê sendo jogado (ou tentando pegar ele)"},
    {cat:1, text:"Uma selfie com quem você acabou de conhecer na festa"},
    {cat:1, text:"Você imitando o passo de dança de outro convidado"},
    {cat:1, text:"Um photobomb discreto em outra foto de alguém"},
    {cat:1, text:"A cara de quem está adorando o buffet"},
    {cat:1, text:"Recriando uma pose clássica de casamento, só que exagerada"},
    {cat:2, text:"Uma lágrima de emoção de algum convidado"},
    {cat:2, text:"Três gerações numa foto só — avós, pais e crianças"},
    {cat:2, text:"Um abraço apertado entre os noivos e os pais"},
    {cat:2, text:"Um detalhe da decoração que você achou lindo"},
    {cat:2, text:"O olhar de alguém vendo os noivos passarem"},
    {cat:3, text:"Uma foto em grupo gritando \"vivam os noivos!\""},
    {cat:3, text:"O melhor movimento da pista de dança até agora"},
    {cat:3, text:"Um acessório emprestado virando parte do seu look"},
    {cat:3, text:"Uma pose de capa de revista com os padrinhos/madrinhas"},
    {cat:3, text:"Uma foto tentando roubar a cena dos noivos (com carinho)"}
  ];

  var META = {names:"Iana & Wllysses", date:"12 de setembro de 2026", venue:""};
  var POLL_MS = 20000;
  var GUEST_NAME_KEY = 'wg_guest_name';
  var GUEST_INTRO_KEY = 'wg_intro_done';
  var MAX_VIDEO_SECONDS = 30;
  var MAX_VIDEO_BYTES = 150 * 1024 * 1024;

  var state = {submissions: [], loaded: false};
  var activeCat = 'all';
  var currentChallengeId = null;
  // currentMedia: {type:'image', dataUrl} ou {type:'video', file, previewUrl, ext}
  var currentMedia = null;
  var pollTimer = null;
  var guestName = '';
  var introReturnTo = null; // 'challenge' quando "trocar" é aberto de dentro do modal de desafio

  function loadGuestName(){
    try{ return localStorage.getItem(GUEST_NAME_KEY) || ''; }catch(e){ return ''; }
  }
  function saveGuestName(name){
    guestName = (name || '').trim().slice(0,40);
    try{
      localStorage.setItem(GUEST_NAME_KEY, guestName);
      localStorage.setItem(GUEST_INTRO_KEY, '1');
    }catch(e){}
  }
  function hasSeenIntro(){
    try{ return localStorage.getItem(GUEST_INTRO_KEY) === '1'; }catch(e){ return false; }
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function countFor(challengeId){
    var n = 0;
    for(var i=0;i<state.submissions.length;i++){ if(state.submissions[i].challengeId === challengeId) n++; }
    return n;
  }

  function renderHero(meta){
    return '' +
    '<section class="hero">' +
      '<div class="hero-frame"></div>' +
      '<div class="hero-corner tl">' +
        '<img src="assets/flower_navy.webp" style="width:62%;top:-6%;left:-6%;transform:rotate(-8deg);z-index:3;">' +
        '<img src="assets/flower_lavender.webp" style="width:48%;top:32%;left:34%;transform:rotate(10deg);z-index:2;">' +
      '</div>' +
      '<div class="hero-corner tr">' +
        '<img src="assets/flower_blue.webp" style="width:64%;top:-6%;left:-6%;transform:rotate(-8deg);z-index:3;">' +
        '<img src="assets/flower_cream.webp" style="width:46%;top:30%;left:38%;transform:rotate(12deg);z-index:2;">' +
      '</div>' +
      '<div class="wrap">' +
      '<span class="eyebrow">Missão Paparazzi</span>' +
      '<img class="names-img" src="assets/names.webp" alt="' + escapeHtml(meta.names||'') + '">' +
      '<div class="date">' + escapeHtml(meta.date||'') + (meta.venue ? ' · ' + escapeHtml(meta.venue) : '') + '</div>' +
      '<p class="lede">Escolha um desafio abaixo, tire a foto e mande pro <b>mural</b>. ' +
      'Quanto mais gente participar, mais divertido fica o álbum da festa!</p>' +
      '</div>' +
    '</section>';
  }

  function renderGuestChip(){
    var label = guestName
      ? 'Participando como <b>' + escapeHtml(guestName) + '</b>'
      : 'Participando sem nome';
    return '<div style="text-align:center;"><span class="guest-chip">' + label +
      ' · <button type="button" class="link-btn" id="btn-change-name">trocar</button></span></div>';
  }

  function renderChallenges(){
    var html = '<section class="section"><div class="wrap">' +
      '<div class="section-head">' + renderGuestChip() + '<h2>Os desafios</h2>' +
      '<p>Pode repetir um desafio quantas vezes quiser — vale todo mundo tentar o mesmo!</p></div>' +
      '<div class="cat-tabs" id="cat-tabs">' +
        '<button type="button" class="cat-tab' + (activeCat==='all'?' is-active':'') + '" data-cat="all">Todos</button>' +
        CATEGORIES.map(function(c,ci){ return '<button type="button" class="cat-tab' + (activeCat===String(ci)?' is-active':'') + '" data-cat="'+ci+'">'+escapeHtml(c)+'</button>'; }).join('') +
      '</div>' +
      '<div class="challenge-grid" id="challenge-grid">';
    for(var i=0;i<CHALLENGES.length;i++){
      var n = countFor(i);
      var ch = CHALLENGES[i];
      var hidden = (activeCat !== 'all' && String(ch.cat) !== activeCat);
      html += '<div class="ticket" data-cat="' + ch.cat + '"' + (hidden ? ' hidden' : '') + '>' +
        '<span class="num">' + String(i+1).padStart(2,'0') + '</span>' +
        '<div class="cat-label">' + escapeHtml(CATEGORIES[ch.cat]) + '</div>' +
        '<div class="txt">' + escapeHtml(ch.text) + '</div>' +
        '<div class="meta-row"><span class="count">' + n + (n===1?' foto enviada':' fotos enviadas') + '</span></div>' +
        '<button type="button" class="go" data-challenge="' + i + '">Tirar / enviar foto ou vídeo</button>' +
      '</div>';
    }
    html += '</div></div></section>';
    return html;
  }

  function renderGallery(){
    if(!state.loaded){
      return '<section class="section"><div class="wrap">' +
        '<div class="section-head"><h2>Mural de fotos</h2><p>Tudo que a galera já mandou até agora.</p></div>' +
        '<div class="gallery-empty">Carregando fotos...</div>' +
      '</div></section>';
    }
    var subs = state.submissions.slice().sort(function(a,b){ return b.ts - a.ts; });
    var body;
    if(subs.length === 0){
      body = '<div class="gallery-empty">Ainda não tem nenhuma foto no mural. Seja o primeiro a topar um desafio!</div>';
    } else {
      body = '<div class="gallery">';
      for(var i=0;i<subs.length;i++){
        var s = subs[i];
        var label = (s.challengeId != null && CHALLENGES[s.challengeId] != null) ? ('#' + (s.challengeId+1)) : '';
        var src = s.localPreviewUrl || s.url;
        var mediaTag = s.type === 'video'
          ? '<video src="' + src + '" muted playsinline preload="metadata" controls></video>'
          : '<img src="' + src + '" alt="' + escapeHtml((CHALLENGES[s.challengeId] && CHALLENGES[s.challengeId].text) || 'foto do mural') + '" loading="lazy">';
        body += '<figure class="photo-card">' +
          mediaTag +
          '<div class="cap"><span class="who">' + escapeHtml(s.name || 'Convidado(a)') + '</span>' +
          '<span class="tag">' + label + '</span></div>' +
        '</figure>';
      }
      body += '</div>';
    }
    return '<section class="section"><div class="wrap">' +
      '<div class="section-head"><h2>Mural de fotos</h2><p>Tudo que a galera já mandou até agora.</p></div>' +
      body +
    '</div></section>';
  }

  function renderLeaderboard(){
    var counts = {};
    state.submissions.forEach(function(s){
      var name = (s.name || '').trim();
      if(!name) return;
      counts[name] = (counts[name]||0) + 1;
    });
    var top = Object.keys(counts).map(function(k){ return {name:k, n:counts[k]}; })
      .sort(function(a,b){ return b.n - a.n; }).slice(0,3);
    if(top.length === 0) return '';
    return '<div class="leaderboard">Top paparazzi: ' +
      top.map(function(t,i){ return (i+1)+'º '+escapeHtml(t.name)+' ('+t.n+')'; }).join(' · ') +
    '</div>';
  }

  function renderFooter(){
    var n = state.submissions.length;
    return '<footer><div class="wrap">' +
      '<div class="stats">' + n + (n===1 ? ' foto no mural' : ' fotos no mural') + '</div>' +
      renderLeaderboard() +
      '<div class="status-line" id="footer-status"></div>' +
      '<p class="thanks">Obrigado por fazer parte do nosso grande dia — cada foto e cada desafio topado deixam essa festa ainda mais especial. Com carinho, Iana &amp; Wllysses.</p>' +
      '<div class="credit">Desenvolvido por RafaTech · <a href="mailto:jr.araujo.ti@gmail.com">jr.araujo.ti@gmail.com</a></div>' +
    '</div></footer>';
  }

  function renderModalShell(){
    return '' +
    '<div class="modal-overlay" id="modal-overlay" hidden>' +
      '<div class="modal"><div class="modal-inner">' +
        '<button type="button" class="modal-close" id="modal-close" aria-label="Fechar">&times;</button>' +
        '<span class="num" id="modal-num"></span>' +
        '<h3 id="modal-challenge-text"></h3>' +
        '<div id="modal-body"></div>' +
        '<div class="status-line" id="modal-status"></div>' +
      '</div></div>' +
    '</div>';
  }

  function renderIntroOverlay(){
    return '' +
    '<div class="modal-overlay" id="intro-overlay" hidden>' +
      '<div class="modal"><div class="modal-inner">' +
        '<span class="intro-eyebrow">Antes de começar</span>' +
        '<h3>Quer aparecer com seu nome nas fotos?</h3>' +
        '<label for="intro-name-input">Seu nome</label>' +
        '<input type="text" id="intro-name-input" placeholder="Ex: Rafa (opcional)" maxlength="40">' +
        '<div class="actions"><button type="button" class="btn-primary" id="btn-intro-continue">Ir para os desafios</button></div>' +
        '<div class="intro-note">Pode deixar em branco se preferir não se identificar.</div>' +
      '</div></div>' +
    '</div>';
  }

  function renderDivider(){
    return '<div class="wrap"><div class="seal-divider">' +
      '<span class="line"></span>' +
      '<span class="amp">&amp;</span>' +
      '<span class="line right"></span>' +
    '</div></div>';
  }

  function renderBody(){
    return renderHero(META) + renderChallenges() + renderDivider() + renderGallery() + renderFooter() + renderModalShell() + renderIntroOverlay();
  }

  function render(){
    var modalWasOpen = !document.getElementById('modal-overlay') ? false : !document.getElementById('modal-overlay').hidden;
    var introWasOpen = !document.getElementById('intro-overlay') ? false : !document.getElementById('intro-overlay').hidden;
    var introTypedName = introWasOpen ? document.getElementById('intro-name-input').value : null;
    document.getElementById('root').innerHTML = renderBody();
    if(modalWasOpen && currentChallengeId != null){
      reopenModal();
    }
    if(introWasOpen){
      openIntro(introTypedName != null ? introTypedName : guestName);
    }
  }

  /* ---------- data loading ---------- */
  function fetchPhotos(){
    return fetch('/api/photos').then(function(r){ return r.json(); }).then(function(data){
      if(!data || !data.ok) return;
      var localById = {};
      state.submissions.forEach(function(s){ if(s.localPreviewUrl) localById[s.id] = s.localPreviewUrl; });
      var merged = data.photos.map(function(p){
        if(localById[p.id]) p.localPreviewUrl = localById[p.id];
        return p;
      });
      state.submissions = merged;
      state.loaded = true;
      render();
    }).catch(function(){ /* silencioso, tenta de novo no próximo poll */ });
  }

  function startPolling(){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(fetchPhotos, POLL_MS);
  }

  /* ---------- image handling ---------- */
  function compressFile(file){
    return new Promise(function(resolve, reject){
      var maxDim = 1080, quality = 0.75;
      function draw(bitmap){
        var w = bitmap.width, h = bitmap.height;
        var scale = Math.min(1, maxDim / Math.max(w,h));
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(bitmap, 0, 0, cw, ch);
        var url = canvas.toDataURL('image/jpeg', quality);
        var tries = 0;
        while(url.length > 900000 && tries < 5){
          quality = Math.max(0.35, quality - 0.1);
          url = canvas.toDataURL('image/jpeg', quality);
          tries++;
        }
        resolve(url);
      }
      if(window.createImageBitmap){
        createImageBitmap(file, {imageOrientation:'from-image'}).then(draw).catch(function(){
          fallbackViaImg();
        });
      } else {
        fallbackViaImg();
      }
      function fallbackViaImg(){
        var reader = new FileReader();
        reader.onload = function(){
          var img = new Image();
          img.onload = function(){ draw(img); };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      }
    });
  }

  /* ---------- video handling ---------- */
  function sanitizeNameClient(name){
    return String(name || '').trim().slice(0, 40).replace(/[\r\n]/g, ' ');
  }

  function guessVideoExt(mime){
    if(!mime) return 'mp4';
    if(mime.indexOf('quicktime') !== -1) return 'mov';
    if(mime.indexOf('webm') !== -1) return 'webm';
    if(mime.indexOf('3gpp') !== -1) return '3gp';
    if(mime.indexOf('x-m4v') !== -1) return 'm4v';
    return 'mp4';
  }

  // Lê a duração do vídeo no próprio navegador antes de mandar pro servidor,
  // pra barrar vídeo comprido sem gastar dados do convidado.
  function prepareVideo(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var v = document.createElement('video');
      v.preload = 'metadata';
      v.onloadedmetadata = function(){
        var d = v.duration;
        if(!isFinite(d) || d <= 0){
          URL.revokeObjectURL(url);
          reject({code: 'duracao_desconhecida'});
          return;
        }
        if(d > MAX_VIDEO_SECONDS + 0.5){
          URL.revokeObjectURL(url);
          reject({code: 'video_longo_demais', duration: d});
          return;
        }
        resolve({previewUrl: url, duration: d});
      };
      v.onerror = function(){
        URL.revokeObjectURL(url);
        reject({code: 'video_invalido'});
      };
      v.src = url;
    });
  }

  // Mesma convenção de nome usada pelas fotos (api/upload.js), só que
  // montada aqui porque o vídeo vai direto do navegador pro Blob Storage.
  function buildVideoPathname(challengeId, name, ext){
    var ts = Date.now();
    var rid = Math.random().toString(36).slice(2, 8);
    var cleanName = sanitizeNameClient(name);
    return {
      pathname: 'wg__' + ts + '__ch' + challengeId + '__' + encodeURIComponent(cleanName || 'convidado') + '__' + rid + '.' + ext,
      ts: ts,
      cleanName: cleanName,
    };
  }

  // Espera o módulo do Vercel Blob (carregado via <script type="module"> no
  // topo da página) terminar de carregar antes de tentar enviar um vídeo.
  function getBlobUpload(){
    return new Promise(function(resolve, reject){
      if(window.__blobUpload){ resolve(window.__blobUpload); return; }
      if(window.__blobUploadError){ reject(new Error('blob_client_load_failed')); return; }
      var tries = 0;
      var iv = setInterval(function(){
        tries++;
        if(window.__blobUpload){ clearInterval(iv); resolve(window.__blobUpload); }
        else if(window.__blobUploadError){ clearInterval(iv); reject(new Error('blob_client_load_failed')); }
        else if(tries > 100){ clearInterval(iv); reject(new Error('blob_client_timeout')); }
      }, 100);
    });
  }

  /* ---------- modal wiring ---------- */
  function openModal(challengeId){
    currentChallengeId = challengeId;
    currentMedia = null;
    reopenModal();
  }

  function reopenModal(){
    var overlay = document.getElementById('modal-overlay');
    document.getElementById('modal-num').textContent = String(currentChallengeId+1).padStart(2,'0');
    document.getElementById('modal-challenge-text').textContent = CHALLENGES[currentChallengeId].text;
    document.getElementById('modal-status').textContent = '';
    document.getElementById('modal-status').className = 'status-line';
    renderModalBody();
    overlay.hidden = false;
  }

  function closeModal(){
    document.getElementById('modal-overlay').hidden = true;
    currentChallengeId = null;
    currentMedia = null;
  }

  function openIntro(prefill){
    var overlay = document.getElementById('intro-overlay');
    if(!overlay) return;
    var input = document.getElementById('intro-name-input');
    input.value = prefill != null ? prefill : guestName;
    overlay.hidden = false;
    setTimeout(function(){ input.focus(); }, 50);
  }

  function closeIntro(){
    var overlay = document.getElementById('intro-overlay');
    if(overlay) overlay.hidden = true;
  }

  function confirmIntro(){
    var input = document.getElementById('intro-name-input');
    saveGuestName(input ? input.value : '');
    closeIntro();
    introReturnTo = null;
    render();
  }

  function renderModalBody(){
    var mb = document.getElementById('modal-body');
    if(!currentMedia){
      mb.innerHTML =
        '<label for="photo-input">Sua foto ou vídeo</label>' +
        '<label class="file-pick" for="photo-input">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:26px;height:26px;flex:none;"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1-1.5h6L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-9Z"/><circle cx="12" cy="13" r="3.2"/></svg>' +
        '<span>Toque para tirar uma foto ou gravar um vídeo (até 30s)</span>' +
        '<input class="visually-hidden" type="file" id="photo-input" accept="image/*,video/*" capture="environment">' +
        '</label>';
      var input = document.getElementById('photo-input');
      input.addEventListener('change', function(e){
        var f = e.target.files && e.target.files[0];
        if(!f) return;
        var statusEl = document.getElementById('modal-status');
        var isVideo = f.type.indexOf('video/') === 0;
        if(isVideo){
          if(f.size > MAX_VIDEO_BYTES){
            statusEl.textContent = 'Esse vídeo é grande demais (máx. ' + Math.round(MAX_VIDEO_BYTES/1024/1024) + 'MB). Tenta um vídeo mais curto.';
            statusEl.className = 'status-line err';
            return;
          }
          statusEl.textContent = 'Conferindo o vídeo...';
          statusEl.className = 'status-line';
          prepareVideo(f).then(function(info){
            currentMedia = {type: 'video', file: f, previewUrl: info.previewUrl, ext: guessVideoExt(f.type)};
            statusEl.textContent = '';
            renderModalBody();
          }).catch(function(err){
            if(err && err.code === 'video_longo_demais'){
              statusEl.textContent = 'Esse vídeo passa de 30 segundos. Grava um pedacinho mais curto e tenta de novo!';
            } else {
              statusEl.textContent = 'Não consegui ler esse vídeo, tenta outro.';
            }
            statusEl.className = 'status-line err';
          });
        } else {
          statusEl.textContent = 'Preparando a foto...';
          statusEl.className = 'status-line';
          compressFile(f).then(function(dataUrl){
            currentMedia = {type: 'image', dataUrl: dataUrl};
            statusEl.textContent = '';
            renderModalBody();
          }).catch(function(){
            statusEl.textContent = 'Não consegui ler essa foto, tenta outra.';
            statusEl.className = 'status-line err';
          });
        }
      });
    } else {
      var whoLabel = guestName ? escapeHtml(guestName) : 'Convidado(a) (sem nome)';
      var mediaHtml = currentMedia.type === 'video'
        ? '<video src="' + currentMedia.previewUrl + '" controls playsinline muted></video>'
        : '<img src="' + currentMedia.dataUrl + '" alt="pré-visualização">';
      mb.innerHTML =
        '<div class="preview-wrap">' + mediaHtml + '<button type="button" class="retake" id="btn-retake">Trocar</button></div>' +
        '<div class="guest-line">Vai aparecer como <b>' + whoLabel + '</b> · <button type="button" class="link-btn" id="btn-modal-change-name">trocar</button></div>' +
        '<div class="actions">' +
        '<button type="button" class="btn-primary" id="btn-submit">Enviar pro mural</button>' +
        '</div>' +
        '<div class="share-fallback"><button type="button" class="btn-secondary" id="btn-share-alt" style="width:100%">Ou compartilhar por fora</button></div>';
      document.getElementById('btn-retake').addEventListener('click', function(){
        if(currentMedia && currentMedia.type === 'video' && currentMedia.previewUrl){
          try{ URL.revokeObjectURL(currentMedia.previewUrl); }catch(e){}
        }
        currentMedia = null; renderModalBody();
      });
      document.getElementById('btn-submit').addEventListener('click', onSubmitMedia);
      document.getElementById('btn-share-alt').addEventListener('click', onShareExternal);
      document.getElementById('btn-modal-change-name').addEventListener('click', function(){
        introReturnTo = 'challenge';
        openIntro(guestName);
      });
    }
  }

  function dataUrlToBlob(dataUrl){
    var parts = dataUrl.split(',');
    var mime = parts[0].match(/:(.*?);/)[1];
    var bin = atob(parts[1]);
    var arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], {type:mime});
  }

  function onShareExternal(){
    if(!currentMedia) return;
    var file;
    if(currentMedia.type === 'video'){
      file = currentMedia.file;
    } else {
      var blob = dataUrlToBlob(currentMedia.dataUrl);
      file = new File([blob], 'desafio.jpg', {type:'image/jpeg'});
    }
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:'Desafio do casamento', text: CHALLENGES[currentChallengeId].text}).catch(function(){});
    } else {
      var statusEl = document.getElementById('modal-status');
      statusEl.textContent = 'Seu navegador não abre o menu de compartilhar aqui — segura na imagem pra salvar e manda pelo WhatsApp!';
      statusEl.className = 'status-line';
    }
  }

  function onSubmitMedia(){
    if(!currentMedia) return;
    var statusEl = document.getElementById('modal-status');
    var btn = document.getElementById('btn-submit');
    btn.disabled = true;
    statusEl.textContent = 'Enviando...';
    statusEl.className = 'status-line';
    var name = guestName;
    var challengeId = currentChallengeId;
    var media = currentMedia;

    function onOk(entry){
      state.submissions.unshift(entry);
      render();
      var statusEl2 = document.getElementById('modal-status');
      if(statusEl2){
        statusEl2.textContent = 'Enviado! Já deve aparecer no mural.';
        statusEl2.className = 'status-line ok';
      }
      setTimeout(closeModal, 900);
    }
    function onFail(msg){
      statusEl.textContent = msg || 'Não deu pra enviar agora. Confere sua internet e tenta de novo.';
      statusEl.className = 'status-line err';
      btn.disabled = false;
    }

    if(media.type === 'image'){
      fetch('/api/upload', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({challengeId: challengeId, name: name, photo: media.dataUrl})
      }).then(function(r){ return r.json().then(function(data){ return {ok: r.ok, data: data}; }); })
        .then(function(res){
          if(!res.ok || !res.data || !res.data.ok){
            throw new Error((res.data && res.data.error) || 'erro');
          }
          onOk({
            id: res.data.id,
            challengeId: res.data.challengeId,
            name: res.data.name,
            ts: res.data.ts,
            type: 'image',
            localPreviewUrl: media.dataUrl,
            url: res.data.url
          });
        }).catch(function(){ onFail(); });
    } else {
      statusEl.textContent = 'Enviando vídeo... isso pode levar um instante.';
      getBlobUpload().then(function(upload){
        var built = buildVideoPathname(challengeId, name, media.ext);
        return upload(built.pathname, media.file, {
          access: 'public',
          handleUploadUrl: '/api/upload-video',
          contentType: media.file.type || ('video/' + media.ext)
        }).then(function(blob){
          onOk({
            id: blob.pathname,
            challengeId: challengeId,
            name: built.cleanName,
            ts: built.ts,
            type: 'video',
            localPreviewUrl: media.previewUrl,
            url: blob.url
          });
        });
      }).catch(function(err){
        var code = err && (err.message || err.code);
        if(code === 'blob_client_timeout' || code === 'blob_client_load_failed'){
          onFail('Não consegui carregar o suporte a vídeo. Confere sua internet e tenta de novo.');
        } else {
          onFail('Não deu pra enviar o vídeo agora. Confere sua internet e tenta de novo.');
        }
      });
    }
  }

  /* ---------- wiring ---------- */
  function wireStatic(){
    document.body.addEventListener('click', function(e){
      var goBtn = e.target.closest('button.go');
      if(goBtn){ openModal(parseInt(goBtn.getAttribute('data-challenge'),10)); return; }
      if(e.target.id === 'modal-close' || e.target.id === 'modal-overlay'){ closeModal(); return; }
      if(e.target.id === 'btn-intro-continue'){ confirmIntro(); return; }
      if(e.target.id === 'btn-change-name'){ introReturnTo = null; openIntro(guestName); return; }
      var catTab = e.target.closest('.cat-tab');
      if(catTab){
        activeCat = catTab.getAttribute('data-cat');
        render();
        return;
      }
    });
    document.body.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && e.target && e.target.id === 'intro-name-input'){
        e.preventDefault();
        confirmIntro();
      }
    });
  }

  function init(){
    guestName = loadGuestName();
    render();
    wireStatic();
    fetchPhotos();
    startPolling();
    if(!hasSeenIntro()){
      openIntro(guestName);
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
